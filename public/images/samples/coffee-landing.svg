<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="a" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c4813f"/><stop offset="1" stop-color="#f0c391"/></linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e8d5"/><stop offset="1" stop-color="#c19e78"/></linearGradient>
    <radialGradient id="glow" cx="75%" cy="50%" r="55%"><stop offset="0" stop-color="#d9a066" stop-opacity=".35"/><stop offset="1" stop-color="#120d0a" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="800" height="500" fill="#120d0a"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <line x1="0" y1="52" x2="800" y2="52" stroke="#fff" stroke-opacity=".08"/>
  <text x="40" y="35" font-size="22" font-weight="700" fill="#f6ece1">Ember<tspan fill="#d9a066">.</tspan></text>
  <text x="590" y="33" font-size="13" fill="#b9a999">Menu</text>
  <text x="650" y="33" font-size="13" fill="#b9a999">Story</text>
  <text x="710" y="33" font-size="13" fill="#b9a999">Reserve</text>

  <text x="48" y="130" font-size="12" letter-spacing="4" fill="#d9a066">SMALL-BATCH ROASTERS</text>
  <text x="48" y="196" font-size="58" font-weight="700" fill="#f6ece1">Coffee,</text>
  <text x="48" y="256" font-size="58" font-weight="700" fill="#d9a066">slowly</text>
  <text x="48" y="316" font-size="58" font-weight="700" fill="#f6ece1">made.</text>
  <rect x="48" y="342" width="140" height="42" rx="21" fill="url(#a)"/>
  <text x="118" y="368" font-size="14" font-weight="700" fill="#1a0f07" text-anchor="middle">See the menu</text>
  <rect x="200" y="342" width="150" height="42" rx="21" fill="none" stroke="#fff" stroke-opacity=".2"/>
  <text x="275" y="368" font-size="14" fill="#f6ece1" text-anchor="middle">Reserve a table</text>

  <!-- cup -->
  <g transform="translate(470 120)">
    <rect x="68" y="0" width="12" height="56" rx="6" fill="#fff" opacity=".35" filter="url(#blur)"/>
    <rect x="108" y="-14" width="12" height="60" rx="6" fill="#fff" opacity=".28" filter="url(#blur)"/>
    <rect x="148" y="2" width="12" height="52" rx="6" fill="#fff" opacity=".3" filter="url(#blur)"/>
    <ellipse cx="124" cy="262" rx="132" ry="16" fill="#eadac4"/>
    <ellipse cx="124" cy="282" rx="120" ry="10" fill="#000" opacity=".35" filter="url(#blur)"/>
    <path d="M24 100 H224 Q224 250 124 250 Q24 250 24 100Z" fill="url(#cup)"/>
    <path d="M222 128 q60 6 54 56 q-6 40 -50 36" fill="none" stroke="#e0c7a6" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="124" cy="100" rx="100" ry="20" fill="#3a1f0d" stroke="#f0dfc8" stroke-width="4"/>
    <ellipse cx="124" cy="100" rx="70" ry="12" fill="#6b3d1d"/>
  </g>
</svg>
