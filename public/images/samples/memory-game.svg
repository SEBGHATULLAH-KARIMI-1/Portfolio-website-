<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c74646"/><stop offset="1" stop-color="#6b1f4a"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c74646"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
    <radialGradient id="g1" cx="15%" cy="0%" r="60%"><stop offset="0" stop-color="#7c4dff" stop-opacity=".35"/><stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="100%" r="60%"><stop offset="0" stop-color="#c74646" stop-opacity=".35"/><stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/></radialGradient>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="12" fill="#fff" opacity=".09"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="800" height="500" fill="#0a0a0f"/>
  <rect width="800" height="500" fill="url(#g1)"/>
  <rect width="800" height="500" fill="url(#g2)"/>

  <text x="400" y="62" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">Memory <tspan fill="url(#title)">Match</tspan></text>

  <g fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1">
    <rect x="250" y="82" width="90" height="46" rx="12"/><rect x="355" y="82" width="90" height="46" rx="12"/><rect x="460" y="82" width="90" height="46" rx="12"/>
  </g>
  <g font-size="9" fill="#a5a5b5" letter-spacing="1.5" text-anchor="middle">
    <text x="295" y="98">MOVES</text><text x="400" y="98">TIME</text><text x="505" y="98">BEST</text>
  </g>
  <g font-size="18" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="295" y="120">9</text><text x="400" y="120">0:42</text><text x="505" y="120">14</text>
  </g>

  <!-- 4x3 visible grid -->
  <g filter="url(#shadow)">
    <!-- row 1 -->
    <rect x="212" y="150" width="86" height="86" rx="16" fill="#181822" stroke="#fff" stroke-opacity=".1"/>
    <rect x="308" y="150" width="86" height="86" rx="16" fill="url(#front)"/><rect x="308" y="150" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <rect x="404" y="150" width="86" height="86" rx="16" fill="rgba(74,222,128,.14)" stroke="#4ade80" stroke-opacity=".6"/>
    <rect x="500" y="150" width="86" height="86" rx="16" fill="url(#front)"/><rect x="500" y="150" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <!-- row 2 -->
    <rect x="212" y="246" width="86" height="86" rx="16" fill="url(#front)"/><rect x="212" y="246" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <rect x="308" y="246" width="86" height="86" rx="16" fill="rgba(74,222,128,.14)" stroke="#4ade80" stroke-opacity=".6"/>
    <rect x="404" y="246" width="86" height="86" rx="16" fill="url(#front)"/><rect x="404" y="246" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <rect x="500" y="246" width="86" height="86" rx="16" fill="#181822" stroke="#fff" stroke-opacity=".1"/>
    <!-- row 3 -->
    <rect x="212" y="342" width="86" height="86" rx="16" fill="url(#front)"/><rect x="212" y="342" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <rect x="308" y="342" width="86" height="86" rx="16" fill="url(#front)"/><rect x="308" y="342" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <rect x="404" y="342" width="86" height="86" rx="16" fill="url(#front)"/><rect x="404" y="342" width="86" height="86" rx="16" fill="url(#stripes)"/>
    <rect x="500" y="342" width="86" height="86" rx="16" fill="url(#front)"/><rect x="500" y="342" width="86" height="86" rx="16" fill="url(#stripes)"/>
  </g>

  <g font-size="40" text-anchor="middle">
    <text x="255" y="206">🚀</text><text x="447" y="206">🎧</text>
    <text x="351" y="302">🎧</text><text x="543" y="302">🌵</text>
  </g>
  <g font-size="28" font-weight="700" fill="#fff" fill-opacity=".85" text-anchor="middle">
    <text x="351" y="204">?</text><text x="543" y="204">?</text>
    <text x="255" y="300">?</text><text x="447" y="300">?</text>
    <text x="255" y="396">?</text><text x="351" y="396">?</text><text x="447" y="396">?</text><text x="543" y="396">?</text>
  </g>

  <rect x="340" y="448" width="120" height="38" rx="19" fill="#c74646"/>
  <text x="400" y="472" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">New game</text>
</svg>
