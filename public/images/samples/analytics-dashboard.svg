    <line x1="196" x2="546" y1="358" y2="358"/><line x1="196" x2="546" y1="412" y2="412"/>
  </g>
  <path d="M196 380 C 220 380 226 330 250 336 C 278 344 284 380 310 360 C 336 340 340 300 366 292 C 392 284 398 320 424 300 C 450 280 456 256 482 262 C 508 268 516 236 546 244 L546 430 L196 430Z" fill="url(#area)"/>
  <path d="M196 380 C 220 380 226 330 250 336 C 278 344 284 380 310 360 C 336 340 340 300 366 292 C 392 284 398 320 424 300 C 450 280 456 256 482 262 C 508 268 516 236 546 244" fill="none" stroke="#6c7bff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="424" cy="300" r="6" fill="#fff" stroke="#6c7bff" stroke-width="3"/>
  <line x1="424" x2="424" y1="236" y2="430" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
  <rect x="384" y="214" width="80" height="34" rx="9" fill="#1d2236" stroke="#fff" stroke-opacity=".1"/>
