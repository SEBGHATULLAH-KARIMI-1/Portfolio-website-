  <text x="656" y="51" font-size="11" fill="#8b92a8" text-anchor="middle">7D</text>
  <text x="744" y="51" font-size="11" fill="#8b92a8" text-anchor="middle">90D</text>

  <!-- KPIs -->
  <g font-size="10" fill="#8b92a8" letter-spacing="1">
    <rect x="176" y="84" width="140" height="82" rx="14" fill="#131724" stroke="#fff" stroke-opacity=".07"/>
    <text x="190" y="106">REVENUE</text>
    <text x="190" y="136" font-size="22" font-weight="700" fill="#eef0f8" letter-spacing="0">$48,210</text>
    <text x="190" y="155" font-size="11" fill="#4ade80" letter-spacing="0">▲ 12.4%</text>

    <rect x="328" y="84" width="140" height="82" rx="14" fill="#131724" stroke="#fff" stroke-opacity=".07"/>
    <text x="342" y="106">ORDERS</text>
    <text x="342" y="136" font-size="22" font-weight="700" fill="#eef0f8" letter-spacing="0">778</text>
    <text x="342" y="155" font-size="11" fill="#4ade80" letter-spacing="0">▲ 8.1%</text>

    <rect x="480" y="84" width="140" height="82" rx="14" fill="#131724" stroke="#fff" stroke-opacity=".07"/>
    <text x="494" y="106">VISITORS</text>
    <text x="494" y="136" font-size="22" font-weight="700" fill="#eef0f8" letter-spacing="0">19,402</text>
    <text x="494" y="155" font-size="11" fill="#f87171" letter-spacing="0">▼ 2.3%</text>

    <rect x="632" y="84" width="140" height="82" rx="14" fill="#131724" stroke="#fff" stroke-opacity=".07"/>
