  <text x="30" y="143" font-size="13" fill="#8b92a8">Reports</text>
  <text x="30" y="179" font-size="13" fill="#8b92a8">Orders</text>
  <text x="30" y="215" font-size="13" fill="#8b92a8">Customers</text>
  <text x="30" y="251" font-size="13" fill="#8b92a8">Settings</text>

