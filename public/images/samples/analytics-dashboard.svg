  <text x="424" y="242" font-size="9" fill="#8b92a8" text-anchor="middle">Oct 14</text>

  <!-- sources -->
  <rect x="576" y="182" width="196" height="290" rx="16" fill="#131724" stroke="#fff" stroke-opacity=".07"/>
  <text x="594" y="212" font-size="14" font-weight="600" fill="#eef0f8">Traffic sources</text>
  <g font-size="11" fill="#eef0f8">
    <text x="594" y="244">Organic search</text><text x="754" y="244" text-anchor="end">42%</text>
    <rect x="594" y="252" width="160" height="7" rx="4" fill="#fff" fill-opacity=".06"/><rect x="594" y="252" width="134" height="7" rx="4" fill="url(#bar)"/>
    <text x="594" y="292">Direct</text><text x="754" y="292" text-anchor="end">27%</text>
    <rect x="594" y="300" width="160" height="7" rx="4" fill="#fff" fill-opacity=".06"/><rect x="594" y="300" width="86" height="7" rx="4" fill="url(#bar)"/>
    <text x="594" y="340">Social media</text><text x="754" y="340" text-anchor="end">18%</text>
    <rect x="594" y="348" width="160" height="7" rx="4" fill="#fff" fill-opacity=".06"/><rect x="594" y="348" width="58" height="7" rx="4" fill="url(#bar)"/>
    <text x="594" y="388">Referral</text><text x="754" y="388" text-anchor="end">13%</text>
    <rect x="594" y="396" width="160" height="7" rx="4" fill="#fff" fill-opacity=".06"/><rect x="594" y="396" width="42" height="7" rx="4" fill="url(#bar)"/>
