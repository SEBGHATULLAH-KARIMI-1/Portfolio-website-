    <text x="646" y="136" font-size="22" font-weight="700" fill="#eef0f8" letter-spacing="0">4.01%</text>
    <text x="646" y="155" font-size="11" fill="#4ade80" letter-spacing="0">▲ 0.6%</text>
  </g>

