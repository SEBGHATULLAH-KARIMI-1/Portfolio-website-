    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6c7bff"/><stop offset="1" stop-color="#3ddbd9"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="#0b0d14"/>

  <!-- sidebar -->
  <rect width="150" height="500" fill="#0e1119"/>
