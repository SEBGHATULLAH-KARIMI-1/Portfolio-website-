<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Memory Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header>
      <h1>Memory <span>Match</span></h1>
      <p class="sub">Flip the cards and find all 8 pairs.</p>
    </header>

    <section class="stats" aria-live="polite">
      <div><small>Moves</small><b id="moves">0</b></div>
      <div><small>Time</small><b id="time">0:00</b></div>
      <div><small>Best</small><b id="best">–</b></div>
    </section>

    <div id="board" class="board" role="group" aria-label="Memory cards"></div>

    <button id="restart" class="restart" type="button">New game</button>
  </main>

  <div id="win" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <h2 id="winTitle">You did it! 🎉</h2>
      <p id="winText"></p>
      <button id="again" class="restart" type="button">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
