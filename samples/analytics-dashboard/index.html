<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">Pulse<span>.</span></div>
      <nav aria-label="Sidebar">
        <a href="#" class="on">▦ Overview</a>
        <a href="#">◔ Reports</a>
        <a href="#">☰ Orders</a>
        <a href="#">♡ Customers</a>
        <a href="#">⚙ Settings</a>
      </nav>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1>Overview</h1>
          <p class="muted">Sample data · generated locally</p>
        </div>
        <div class="range" role="group" aria-label="Date range">
          <button data-range="7" aria-pressed="false">7D</button>
          <button data-range="30" aria-pressed="true">30D</button>
          <button data-range="90" aria-pressed="false">90D</button>
        </div>
      </header>

      <section class="kpis" id="kpis"></section>

      <section class="grid">
        <article class="panel wide">
          <h2>Daily revenue</h2>
          <div class="chart" id="chartWrap">
            <svg id="chart" viewBox="0 0 720 260" role="img" aria-label="Line chart of daily revenue"></svg>
            <div class="tip" id="tip" hidden></div>
          </div>
        </article>

        <article class="panel">
          <h2>Traffic sources</h2>
          <div id="sources" class="sources"></div>
        </article>

        <article class="panel full">
          <h2>Recent orders</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th></tr></thead>
              <tbody id="orders"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
